# 云端自动打包 Quest 3 APK。
# - 推送到 main：打包并发布到 Releases（固定下载地址见 README「云端自动打包」）
# - 在 Actions 页手动运行（Run workflow）：任意分支都会打包并发布
# - Pull Request：只打包，APK 在这次运行的 Artifacts 里
# 需要的 Secrets 见 README。
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: 检查 Unity 授权
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::缺少 UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD，按 README「云端自动打包」添加到仓库 Secrets 后重新运行。"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Unity Android 镜像很大，先腾出磁盘空间
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: 打包 APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Quest3Player
          buildMethod: CIBuild.BuildQuestApk
          versioning: Custom
          version: ${{ env.VERSION }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          # 可选：固定签名证书。没配置时用调试证书，新版本需要先卸载旧版才能装上。
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: 找到 APK
        id: apk
        run: |
          APK=$(find build -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::没有找到 APK"; exit 1; fi
          cp "$APK" Quest3Player.apk
          ls -lh Quest3Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quest3Player-${{ env.VERSION }}
          path: Quest3Player.apk
          retention-days: 14

      - name: 发布到 Releases
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Quest3 Player ${{ env.VERSION }}
          body: |
            分支 `${{ github.ref_name }}`，提交 ${{ github.sha }}。
            头显浏览器固定下载地址：https://github.com/${{ github.repository }}/releases/latest/download/Quest3Player.apk
          files: Quest3Player.apk
          make_latest: true
